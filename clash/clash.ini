;1、规则集
; 家庭网络与局域网直连
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.list

; 直连白名单
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Direct/Direct.list

; AI
ruleset=AI,https://raw.githubusercontent.com/LingJingMaster/Shadowrocket-Rules/refs/heads/main/AI.list
ruleset=AI,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.list

; Crypto 固定走 SG
ruleset=SG,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Crypto/Crypto.list

; Apple 及直连例外必须位于 Media 与 Global 之前
ruleset=DIRECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Apple/Apple.list

; 流媒体
ruleset=Media,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GlobalMedia/GlobalMedia.list

; 国外通用代理
ruleset=SELECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Global/Global.list

; 默认直连（家庭网络兜底）
ruleset=DIRECT,[]FINAL

;2、策略组
custom_proxy_group=SELECT`select`[]HK`[]SG`[]JP`[]US`[]VPS`[]DIRECT
custom_proxy_group=AI`select`(vps.*(?<![A-Za-z])usa?(?![A-Za-z]))`[]US
custom_proxy_group=Media`select`[]SELECT`[]HK`[]SG`[]JP`[]US`[]DIRECT

;3、节点组
custom_proxy_group=VPS`select`(vps)
custom_proxy_group=HK`url-test`^(?!.*vps).*(香港|HK|Hong Kong|🇭🇰)`https://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=SG`url-test`(新加坡|狮城|SG|Singapore|🇸🇬)`https://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=US`url-test`^(?!.*vps).*(美国|(?<![A-Za-z])USA?(?![A-Za-z])|United States|🇺🇸)`https://www.gstatic.com/generate_204`600,5,50
custom_proxy_group=JP`url-test`(日本|JP|Japan|🇯🇵)`https://www.gstatic.com/generate_204`600,5,50

;4、启用规则集
enable_rule_generator=true
overwrite_original_rules=true
