[General]
dns-server = https://dns.alidns.com/dns-query,https://doh.pub/dns-query
ipv6 = false
private-ip-answer = true
tun-excluded-routes = 239.255.255.250/32
hijack-dns = 8.8.8.8:53,8.8.4.4:53,1.1.1.1:53,1.0.0.1:53,9.9.9.9:53,208.67.222.222:53,208.67.220.220:53,223.5.5.5:53,223.6.6.6:53,119.29.29.29:53,114.114.114.114:53
block-quic = all
update-url = https://raw.githubusercontent.com/SeanXP/proxy-rules/refs/heads/main/shadowrocket/shadowrocket.conf

[Proxy Group]
SELECT = select,HK,SG,JP,US,PROXY,DIRECT,policy-select-name=HK
AI = select,VPS,US,PROXY,DIRECT,policy-select-name=VPS
Media = select,SELECT,HK,SG,JP,US,PROXY,DIRECT,policy-select-name=SELECT
VPS = select,policy-regex-filter=vps.*(?<![A-Za-z])usa?(?![A-Za-z])
HK = url-test,policy-regex-filter=^(?!.*vps).*(香港|HK|Hong Kong|hong kong),url=https://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
SG = url-test,policy-regex-filter=新加坡|狮城|SG|Singapore|singapore,url=https://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
US = url-test,policy-regex-filter=^(?!.*vps).*(美国|(?<![A-Za-z])USA?(?![A-Za-z])|American|american|United States|united states),url=https://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5
JP = url-test,policy-regex-filter=日本|JP|Japan|japan,url=https://www.gstatic.com/generate_204,interval=600,tolerance=50,timeout=5

[Rule]
# 0. 家庭网络与私网例外（必须置于更宽泛的直连规则之前）
IP-CIDR,10.42.0.0/24,home
DOMAIN-SUFFIX,internal,home
DOMAIN-SUFFIX,ihome.seanxp.com,home

# 0.1 本地与私有网络直连
DOMAIN-SUFFIX,local,DIRECT
IP-CIDR,10.0.0.0/8,DIRECT
IP-CIDR,100.64.0.0/10,DIRECT
IP-CIDR,127.0.0.0/8,DIRECT
IP-CIDR,172.16.0.0/12,DIRECT
IP-CIDR,192.168.0.0/16,DIRECT
IP-CIDR,224.0.0.0/24,DIRECT
IP-CIDR,FE80::/10,DIRECT

# 以下远程规则按顺序匹配，命中后不再继续。

# 1. 广告误杀直连白名单（必须置于广告拦截之前）
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Direct/Direct.list,DIRECT

# 2. 广告拦截
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite_Domain.list,REJECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/AdvertisingLite/AdvertisingLite.list,REJECT

# 2.1 HTTPDNS 拦截
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list,REJECT

# 3. 特定服务分流（AI、Crypto、港股、Apple、流媒体）
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/OpenAI/OpenAI.list,AI
RULE-SET,https://raw.githubusercontent.com/LingJingMaster/Shadowrocket-Rules/refs/heads/main/AI.list,AI
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Crypto/Crypto.list,SG
DOMAIN,shortconn.im.qcloud.com,DIRECT
RULE-SET,https://raw.githubusercontent.com/LingJingMaster/Shadowrocket-Rules/refs/heads/main/HK_Broker.list,HK
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Apple/Apple.list,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia_Domain.list,Media
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/GlobalMedia/GlobalMedia.list,Media

# 4. 国外通用代理规则
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global_Domain.list,SELECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/Global/Global.list,SELECT

# 5. 国内域名与通用规则直连
DOMAIN-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China_Domain.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/China/China.list,DIRECT

# 6. 国内 IP 直连
DOMAIN-SUFFIX,qmtsw.com,DIRECT
GEOIP,CN,DIRECT

# 7. 兜底
FINAL,PROXY
